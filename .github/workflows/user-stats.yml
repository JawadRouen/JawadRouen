name: GitHub activity totals

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/user-stats.yml

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate authenticated all-time activity card
        uses: cicirello/user-statistician@36500351ea14b69e68217d4c89eb0f3f06680b17 # v1
        with:
          image-file: github-activity.svg
          include-title: false
          colors: dark
          hide-keys: general repositories languages contribTo
          commit-and-push: false
          show-border: false
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Cross-check generated totals and privacy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail

          profile_query='query($login:String!){user(login:$login){issues{totalCount} pullRequests{totalCount} contributionsCollection{restrictedContributionsCount}}}'
          profile="$(gh api graphql -f query="$profile_query" -F login=JawadRouen)"

          commits="$(gh api -X GET search/commits -f q='author:JawadRouen' -f per_page=1 --jq '.total_count')"
          issues="$(jq -r '.data.user.issues.totalCount' <<<"$profile")"
          pull_requests="$(jq -r '.data.user.pullRequests.totalCount' <<<"$profile")"
          reviews="$(gh api -X GET search/issues -f q='is:pr reviewed-by:JawadRouen' -f per_page=1 --jq '.total_count')"
          private_recent="$(jq -r '.data.user.contributionsCollection.restrictedContributionsCount' <<<"$profile")"

          for expected in "$commits" "$issues" "$pull_requests" "$reviews" "$private_recent"; do
            grep -Fq ">$expected</text>" github-activity.svg
          done

          private_matches=0
          while IFS= read -r identifier; do
            if [[ -n "$identifier" ]] && grep -Fqi -- "$identifier" github-activity.svg; then
              private_matches=$((private_matches + 1))
            fi
          done < <(gh api --paginate '/user/repos?visibility=private&affiliation=owner,collaborator,organization_member&per_page=100' --jq '.[].full_name')

          test "$private_matches" -eq 0
          printf 'Verified commits=%s issues=%s pull_requests=%s reviews=%s private_recent=%s private_identifier_matches=%s\n' \
            "$commits" "$issues" "$pull_requests" "$reviews" "$private_recent" "$private_matches"

      - name: Commit refreshed activity card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- github-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update github-activity.svg - [Skip GitHub Action]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
