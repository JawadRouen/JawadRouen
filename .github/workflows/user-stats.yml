name: Public GitHub profile statistics

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/profile-redesign-v2
    paths:
      - .github/workflows/user-stats.yml
      - README.md

permissions:
  contents: write

concurrency:
  group: public-github-profile-statistics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate authenticated lifetime contribution totals
        uses: cicirello/user-statistician@36500351ea14b69e68217d4c89eb0f3f06680b17 # v1.26.3
        with:
          image-file: github-activity.svg
          include-title: false
          colors: light
          hide-keys: general repositories languages contribTo
          image-width: 720
          commit-and-push: false
          show-border: true
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Generate authenticated engineering depth
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JawadRouen
          filename: github-metrics.svg
          output_action: none
          template: classic
          base: header, repositories, metadata
          config_timezone: America/Toronto
          repositories: 300
          repositories_batch: 25
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no
          commits_authoring: JawadRouen, Jawad Alaoui, Jawad ALAOUI, JawadRouen@users.noreply.github.com, jawad.alaoui@gmail.com
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 5
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugins_errors_fatal: yes

      - name: Collect and validate public-template outputs
        shell: bash
        run: |
          set -euo pipefail
          cp /metrics_renders/github-metrics.svg github-metrics.svg

          outputs=(
            github-activity.svg
            github-metrics.svg
          )

          for output in "${outputs[@]}"; do
            test -s "$output"
            grep -Fq '<svg' "$output"
            if grep -Eiq 'unexpected error|something went wrong|error while' "$output"; then
              echo "Invalid generated metric: $output" >&2
              exit 1
            fi
          done

          grep -Fq 'Most used languages' github-metrics.svg
          grep -Fq 'Lines of code changed' github-metrics.svg
          grep -Fq 'Contributions calendar' github-metrics.svg

      - name: Commit refreshed public-template cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- github-activity.svg github-metrics.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh public profile statistics - [Skip GitHub Action]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
