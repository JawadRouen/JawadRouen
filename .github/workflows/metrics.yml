name: GitHub metrics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate five-year activity report
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JawadRouen
          filename: github-metrics.svg
          committer_branch: ${{ github.ref_name }}
          template: classic
          base: ""
          config_timezone: America/Toronto
          repositories_forks: no
          plugin_calendar: yes
          plugin_calendar_limit: 5
          plugin_languages: yes
          plugin_languages_ignored: Jupyter Notebook, HTML, CSS
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
