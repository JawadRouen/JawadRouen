name: Five-year GitHub calendar

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate authenticated five-year contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JawadRouen
          filename: github-calendar.svg
          committer_branch: ${{ github.ref_name }}
          template: classic
          base: ""
          config_timezone: America/Toronto
          repositories_forks: no
          plugin_calendar: yes
          plugin_calendar_limit: 5
