name: Five-year GitHub calendar

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: github-profile-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate authenticated five-year contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JawadRouen
          filename: github-metrics.svg
          committer_branch: ${{ github.ref_name }}
          template: classic
          base: ""
          config_timezone: America/Toronto
          commits_authoring: Jawad Alaoui, Jawad ALAOUI, JawadRouen
          repositories_forks: no
          plugin_calendar: yes
          plugin_calendar_limit: 5
          plugin_languages: yes
          plugin_languages_ignored: Jupyter Notebook, HTML, CSS
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_languages_indepth: yes
          plugin_languages_categories: programming
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 0
