name: Compare profile metrics generators

on:
  push:
    branches:
      - agent/audit-profile-metrics
    paths:
      - .github/workflows/compare-metrics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out comparison branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate user-statistician contribution card
        uses: cicirello/user-statistician@36500351ea14b69e68217d4c89eb0f3f06680b17 # v1
        with:
          image-file: comparison/user-statistician.svg
          include-title: false
          colors: dark
          hide-keys: general repositories languages
          commit-and-push: false
          show-border: false
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Generate profile-summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release
        with:
          USERNAME: JawadRouen
          BRANCH_NAME: ${{ github.ref_name }}
          AUTO_PUSH: false
          THEME: github_dark
          EXCLUDE: Jupyter Notebook, HTML, CSS
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Upload comparison cards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-metrics-comparison
          path: |
            comparison/user-statistician.svg
            profile-summary-card-output/github_dark/*.svg
          if-no-files-found: error
