name: Five-year engineering depth

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/depth-stats.yml
      - scripts/profile_stats.py
      - tests/test_profile_stats.py

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run generator tests
        run: python3 -m unittest discover -s tests -v

      - name: Extract five full years of authored engineering activity
        run: python3 scripts/profile_stats.py depth --output github-depth.svg --workers 4
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Check private identifiers are absent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail
          private_matches=0
          while IFS= read -r identifier; do
            if [[ -n "$identifier" ]] && grep -Fqi -- "$identifier" github-depth.svg; then
              private_matches=$((private_matches + 1))
            fi
          done < <(gh api --paginate '/user/repos?visibility=private&affiliation=owner,collaborator,organization_member&per_page=100' --jq '.[].full_name')

          test "$private_matches" -eq 0
          printf 'Verified private_identifier_matches=%s\n' "$private_matches"

      - name: Commit refreshed depth card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- github-depth.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update github-depth.svg - [Skip GitHub Action]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
