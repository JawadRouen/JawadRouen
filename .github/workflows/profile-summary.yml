name: GitHub profile summary

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - .github/workflows/profile-summary.yml

permissions:
  contents: write

concurrency:
  group: github-profile-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate authenticated GitHub summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release, 2026-08-06
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: JawadRouen
          BRANCH_NAME: ${{ github.ref_name }}
          UTC_OFFSET: -4
          EXCLUDE: Jupyter Notebook,HTML,CSS
          AUTO_PUSH: true
          THEME: github_dark
          NAME: Jawad Alaoui
