<text class="sub" x="32" y="74">Authenticated GitHub totals across accessible public and private repositories</text>
<rect x="32" y="102" width="216" height="98" rx="10" fill="#161B22" stroke="#30363D"/>
<text class="label" x="48" y="132">Authored commits</text>
<text class="value" x="48" y="174">3,572</text>
